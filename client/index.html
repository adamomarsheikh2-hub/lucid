<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LucidFlex Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.25); border-radius: 99px; }
      input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      ::selection { background: rgba(99,107,255,0.3); }

      @keyframes float { 0%,100% { transform: translateY(0) translateX(0); opacity: 0.3; } 25% { transform: translateY(-20px) translateX(10px); opacity: 0.5; } 50% { transform: translateY(-40px) translateX(-10px); opacity: 0.3; } 75% { transform: translateY(-20px) translateX(15px); opacity: 0.4; } }
      @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 20px rgba(99,107,255,0.3); } 50% { box-shadow: 0 0 40px rgba(99,107,255,0.6); } }
      @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
      @keyframes slide-in-top { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

      #particle-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
      .particle { position: absolute; border-radius: 50%; pointer-events: none; }
      .particle-1 { width: 4px; height: 4px; background: rgba(99,107,255,0.6); animation: float 8s infinite ease-in-out; }
      .particle-2 { width: 6px; height: 6px; background: rgba(159,107,255,0.4); animation: float 10s infinite ease-in-out; }
      .particle-3 { width: 3px; height: 3px; background: rgba(0,214,143,0.5); animation: float 12s infinite ease-in-out; }

      .floating-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
      .orb-1 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(99,107,255,0.08), transparent 70%); top: -100px; right: -100px; animation: pulse-glow 4s ease-in-out infinite; }
      .orb-2 { width: 250px; height: 250px; background: radial-gradient(circle, rgba(159,107,255,0.06), transparent 70%); bottom: -80px; left: -80px; animation: pulse-glow 5s ease-in-out infinite 1s; }
      .orb-3 { width: 200px; height: 200px; background: radial-gradient(circle, rgba(0,214,143,0.05), transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); animation: pulse-glow 6s ease-in-out infinite 2s; }

      .shimmer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 1000px 100%; animation: shimmer 3s infinite; pointer-events: none; z-index: 1; }

      #root { position: relative; z-index: 2; }

      body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(99,107,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(99,107,255,0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 0; animation: slide-in-top 1s ease-out; }

      button:hover, input:hover { filter: drop-shadow(0 0 8px rgba(99,107,255,0.2)); }
      * { transition: filter 0.3s ease; }
    </style>
  </head>
  <body>
    <div id="particle-container"></div>
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>
    <div class="shimmer-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function createParticles() {
        const container = document.getElementById('particle-container');
        const particleCount = 15;
        const particleTypes = ['particle-1', 'particle-2', 'particle-3'];
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement('div');
          const type = particleTypes[Math.floor(Math.random() * particleTypes.length)];
          particle.className = 'particle ' + type;
          particle.style.left = Math.random() * 100 + '%';
          particle.style.top = Math.random() * 100 + '%';
          particle.style.animationDelay = Math.random() * 5 + 's';
          particle.style.animationDuration = (8 + Math.random() * 6) + 's';
          container.appendChild(particle);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createParticles);
      } else {
        createParticles();
      }
    </script>
  </body>
</html>
